version: '3.8'

services:
    app:
        build: ./app
        env_file: ./.env
        ports:
            - 3000:3000
        volumes:
            - ./app:/app
        environment:
            NODE_ENV: development
            DB_HOST: postgres
            DB_PORT: ${DB_PORT}
            DB_USER: ${DB_USER}
            DB_PASS: ${DB_PASS}
            DB_NAME: ${DB_NAME}
            DB_DIALECT: postgres

        deploy:
            resources:
                limits:
                    cpus: '0.50'
                    memory: 512M
                reservations:
                    cpus: '0.25'
                    memory: 256M
        depends_on:
            - postgres

    postgres:
          image: postgres:18-alpine
          env_file: ./.env
          ports:
            - ${DB_PORT}:5432
          volumes:
            - pgdata:/var/lib/postgresql/data
          environment:
              POSTGRES_USER: ${DB_USER}
              POSTGRES_PASSWORD: ${DB_PASS}
              POSTGRES_DB: ${DB_NAME}
          deploy:
            resources:
                limits:
                    cpus: '0.75'
                    memory: 768M
                reservations:
                    cpus: '0.25'
                    memory: 256M

volumes:
    pgdata:
